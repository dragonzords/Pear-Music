name: Extract Zip to Repo

on:
  workflow_dispatch: # Jalanin manual dari tab Actions

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Token dari secret yang lu simpen (butuh scope "workflow" kalau zip isinya ngubah .github/workflows)
          token: ${{ secrets.PAT_TOKEN }}

      - name: Unzip and overwrite everything
        run: |
          ZIP="Pear-Music-main.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::$ZIP nggak ada di root repo. Upload dulu zip-nya ke root."
            exit 1
          fi

          # Ekstrak ke folder sementara
          TMP="$RUNNER_TEMP/extract"
          rm -rf "$TMP" && mkdir -p "$TMP"
          unzip -q "$ZIP" -d "$TMP"

          # Kalau zip punya satu folder paling luar (Pear-Music-main/), masuk ke dalamnya
          SRC="$TMP"
          if [ "$(find "$TMP" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find "$TMP" -mindepth 1 -maxdepth 1)" ]; then
            SRC="$(find "$TMP" -mindepth 1 -maxdepth 1)"
          fi

          # Timpa semua file di root repo (file lama dengan nama sama diganti)
          cp -a "$SRC"/. ./
          chmod +x gradlew 2>/dev/null || true

          # Hapus zip-nya
          rm -f "$ZIP"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          # Cek perubahan sebelum commit
          if ! git diff --cached --quiet; then
            git commit -m "Auto-extract Pear-Music-main.zip (overwrite, zip removed)"

            # Push pakai token lu biar lolos dari proteksi workflow GitHub
            git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          else
            echo "Tidak ada perubahan."
          fi
